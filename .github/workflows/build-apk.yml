name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: "36.0.0"
          cmake: "3.22.1"

      - name: Download vendored dependencies from Google Drive
        run: |
          pip install gdown
          # Download entire folder (each file individually to handle failures)
          FOLDER_ID="1g-Q_i7cf6Ua4KX9ZM6V282EEZvTVVfF7"
          mkdir -p /tmp/gdrive
          cd /tmp/gdrive
          
          # Try to download all files from the folder using wget fallback
          gdown "https://drive.google.com/drive/folders/${FOLDER_ID}" --folder -O /tmp/gdrive/ 2>&1 || echo "gdown folder download finished (some files may have failed)"
          
          echo "=== Files downloaded: ==="
          ls -laR /tmp/gdrive/
          
          # Find and extract zips
          for ZIP in $(find /tmp/gdrive -name "libs.zip" -o -name "jniLibs.zip" 2>/dev/null); do
            echo "Found: $ZIP"
            case "$(basename $ZIP)" in
              libs.zip)
                mkdir -p app/libs
                unzip -o "$ZIP" -d app/libs/
                echo "libs.zip extracted, count: $(ls app/libs/ | wc -l)"
                ;;
              jniLibs.zip)
                mkdir -p app/src/main/jniLibs
                unzip -o "$ZIP" -d app/src/main/jniLibs/
                echo "jniLibs.zip extracted"
                ;;
            esac
          done
          
          # Verify critical dirs exist
          echo "=== libs: ===" && ls app/libs/ 2>/dev/null | head -10
          echo "=== jniLibs: ===" && ls app/src/main/jniLibs/ 2>/dev/null | head -10

      - name: Generate local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Install exact NDK version
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> local.properties

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: operit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
