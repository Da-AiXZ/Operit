name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: "36.0.0"
          cmake: "3.22.1"

      - name: Download vendored dependencies from Google Drive
        run: |
          pip install gdown
          FOLDER_ID="1g-Q_i7cf6Ua4KX9ZM6V282EEZvTVVfF7"
          
          # Download folder to tmp first, then move files to correct locations
          gdown "https://drive.google.com/drive/folders/${FOLDER_ID}" --folder -O /tmp/gdrive/ 2>&1 || true
          
          echo "=== Downloaded files: ==="
          find /tmp/gdrive -name "*.zip" -ls
          
          # Extract zips: the zips INTERNALLY have app/libs/ and app/src/main/jniLibs/ paths
          # We must extract at workspace ROOT (not inside app/libs/)
          for ZIP in $(find /tmp/gdrive -name "libs.zip" -o -name "jniLibs.zip" 2>/dev/null); do
            echo "Extracting $ZIP to workspace root..."
            unzip -o "$ZIP" -d .
          done
          
          echo "=== Verify paths: ==="
          echo "app/libs contents:" && ls app/libs/ 2>/dev/null | head -10
          echo "app/src/main/jniLibs/arm64-v8a:" && ls app/src/main/jniLibs/arm64-v8a/ 2>/dev/null | head -10
          
          # Critical: check that the AAR is in the right place
          if [ -f app/libs/ffmpeg-kit-local.aar ]; then
            echo "FFmpeg AAR FOUND at correct path ✓"
          else
            echo "ERROR: ffmpeg-kit-local.aar NOT at app/libs/"
            find . -name "ffmpeg-kit-local.aar" -ls
          fi

      - name: Generate local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Install exact NDK version
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> local.properties

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: operit-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
