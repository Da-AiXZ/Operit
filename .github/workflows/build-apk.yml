name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: "36.0.0"
          cmake: "3.22.1"

      - name: Download all vendored dependencies from Google Drive
        run: |
          pip install gdown
          gdown --folder "1g-Q_i7cf6Ua4KX9ZM6V282EEZvTVVfF7" -O /tmp/gdrive/ --remaining-ok
          ls -la /tmp/gdrive/
          # Extract libs
          if [ -f /tmp/gdrive/libs.zip ]; then
            mkdir -p app/libs
            unzip -o /tmp/gdrive/libs.zip -d app/libs/
            echo "libs.zip extracted"
          fi
          # Extract jniLibs
          if [ -f /tmp/gdrive/jniLibs.zip ]; then
            mkdir -p app/src/main/jniLibs
            unzip -o /tmp/gdrive/jniLibs.zip -d app/src/main/jniLibs/
            echo "jniLibs.zip extracted"
          fi
          ls app/libs/ | head -5
          ls app/src/main/jniLibs/ 2>/dev/null | head -5

      - name: Generate local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Install exact NDK version
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> local.properties

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: operit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
