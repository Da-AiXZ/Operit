name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout with top-level submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Recursive submodule init (with bullet3 fix)
        run: |
          git submodule foreach --recursive 'git submodule update --init 2>/dev/null || true'
          # bullet3 stub for saba
          mkdir -p mmd/third_party/saba/third_party/bullet3
          [ ! -f mmd/third_party/saba/third_party/bullet3/CMakeLists.txt ] && {
            echo "cmake_minimum_required(VERSION 3.10)" > mmd/third_party/saba/third_party/bullet3/CMakeLists.txt
            echo "project(bullet3)" >> mmd/third_party/saba/third_party/bullet3/CMakeLists.txt
          }
          echo "=== Submodule status ==="
          git submodule status

      - name: Set up JDK17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: "36.0.0"
          cmake: "3.22.1"

      - name: Generate local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Install exact NDK version
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> local.properties

      - name: Ensure libs dir & gradlew perm
        run: |
          mkdir -p app/libs
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: operit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
